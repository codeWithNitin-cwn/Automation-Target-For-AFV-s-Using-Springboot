server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:target_detection;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

app:
  jwt:
    secret: d2VsbC1kb25lLW5pdGluLXlvdXItand0LXNlY3JldC1rZXktaGFzLXRvLWJlLTMyLWJ5dGVzLWxvbmc=
    expiration-ms: 86400000
  ai:
    service-url: http://localhost:8000
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket-name: target-detection-files
