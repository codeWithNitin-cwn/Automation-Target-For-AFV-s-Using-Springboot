server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: target-detection-backend

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:target_detection}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate # Flyway migrations are the source of truth
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

# App Custom Configs
app:
  jwt:
    secret: ${JWT_SECRET:d2VsbC1kb25lLW5pdGluLXlvdXItand0LXNlY3JldC1rZXktaGFzLXRvLWJlLTMyLWJ5dGVzLWxvbmc=}
    expiration-ms: 86400000 # 24 hours
  ai:
    service-url: ${AI_SERVICE_URL:http://localhost:8000}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-name: target-detection-files
